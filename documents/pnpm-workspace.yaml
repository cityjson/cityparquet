allowBuilds:
  esbuild: true
ignoredBuiltDependencies:
  - esbuild
# Blume generates a hidden Astro project (.blume/) that assumes a flat,
# npm-style node_modules. Hoist so its transitive imports resolve.
# NOTE: pnpm 11 no longer reads pnpm settings from .npmrc — they must live
# here, in camelCase. Moving this back to .npmrc silently breaks `pnpm dev`.
shamefullyHoist: true
