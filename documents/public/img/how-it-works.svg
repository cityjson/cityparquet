<svg xmlns="http://www.w3.org/2000/svg" class="cp-readpath" viewBox="0 0 1200 492" role="img" aria-label="CityParquet: a semantic 3D city model stored in object storage, read with column and row-group pruning, returned as a semantic 3D model.">
<style>
  /* Fallbacks for standalone viewing. A host that inlines this overrides them
     with its own tokens — `.cp-figure svg` outranks `.cp-readpath`. */
  .cp-readpath { color:#15181d;
             --hero-accent:#7253ed; --hero-roof:#7253ed;
             --hero-wall:#d8cffa; --hero-ground:#e7e9ee; }
  @media (prefers-color-scheme: dark) {
    .cp-readpath { color:#e7eaf0;
               --hero-accent:#a48ff5; --hero-roof:#a48ff5;
               --hero-wall:#3a3060; --hero-ground:#262c34; }
  }
  .cp-readpath text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
                  fill: currentColor; }
  .cp-readpath .mono { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
  .cp-readpath .h    { font-size:14px; font-weight:600; letter-spacing:.01em; }
  .cp-readpath .sub  { font-size:11px; opacity:.55; }
  .cp-readpath .cap  { font-size:11px; opacity:.62; }
  .cp-readpath .tiny { font-size:10px; opacity:.5; }
  .cp-readpath .acc  { fill: var(--hero-accent); }
  .cp-readpath .accs { stroke: var(--hero-accent); fill:none; }
  .cp-readpath .frame{ fill:none; stroke:currentColor; stroke-opacity:.26; stroke-width:1.25; }
  .cp-readpath .edge { stroke:currentColor; stroke-opacity:.38; stroke-width:1; stroke-linejoin:round; }
</style>
<text class="h" x="40" y="38">Where the model lies</text>
<text class="sub" x="40" y="56">object storage &#183; tens of gigabytes</text>
<text class="h" x="400" y="38">What the query touches</text>
<text class="sub" x="400" y="56">column projection + row-group statistics</text>
<text class="h" x="909" y="38">What comes back</text>
<text class="sub" x="909" y="56">still a semantic 3D model &#183; megabytes</text>
