lsp_servers:
- clangd
- pyright
- rust-analyzer
- typescript-language-server
lsp_configs:
  clangd:
    name: clangd
    command: clangd
    extensionToLanguage:
      .c: c
      .h: cpp
      .cpp: cpp
      .cc: cpp
      .cxx: cpp
      .hpp: cpp
      .hxx: cpp
      .C: cpp
      .H: cpp
  pyright:
    name: pyright
    command: pyright-langserver
    args:
    - --stdio
    extensionToLanguage:
      .py: python
      .pyi: python
  rust-analyzer:
    name: rust-analyzer
    command: rust-analyzer
    extensionToLanguage:
      .rs: rust
  typescript-language-server:
    name: typescript-language-server
    command: typescript-language-server
    args:
    - --stdio
    extensionToLanguage:
      .ts: typescript
      .tsx: typescriptreact
      .mts: typescript
      .cts: typescript
      .js: javascript
      .jsx: javascriptreact
      .mjs: javascript
      .cjs: javascript
