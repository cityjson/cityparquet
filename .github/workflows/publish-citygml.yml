name: Publish CityGML crates

# Publishes the Rust workspace under lib/citygml-rs to crates.io:
# `citygml-core`, `citygml2`, `citygml3`, `citygml-rs` (the library `citygml`,
# whose own name is taken on crates.io) and `citygml-citydb`. Their version is
# their own, independent of the CityParquet crates, and so is their tag:
# `citygml-vX.Y.Z`, beside the crates' bare `vX.Y.Z`.
#
# Run it from main (Actions → Publish CityGML crates → Run workflow) and choose
# the bump. The five crates share one version, so one run publishes all five:
#
#   1. bump the version (.github/scripts/bump-version.py), with the library's
#      requirements on these crates, and refuse one that is already tagged or
#      already on crates.io;
#   2. run the Rust gate, which covers this workspace and the library that
#      depends on it;
#   3. only once it passes, publish in dependency order, then push a
#      `release: citygml-vX.Y.Z` commit and `citygml-vX.Y.Z` tag to main and
#      merge the commit back into develop.
#
# On success the Release workflow creates the GitHub release for
# `citygml-vX.Y.Z`, with the five `.crate` files attached. A crates.io version
# is permanent — yanking hides it, it never frees the number — which is why
# the gate runs before the upload.
#
# A dry run does all of this except the upload and the push: it bumps, gates
# and runs `cargo publish --dry-run`. It runs from any branch; a real publish
# runs only from main.
#
# Needs CARGO_REGISTRY_TOKEN (an organisation secret) and pushes with the
# workflow's own token, so main and develop must accept pushes from
# github-actions[bot].

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (none publishes the version already in Cargo.toml, e.g. the first 0.1.0)"
        type: choice
        options: [patch, minor, major, none]
        default: patch
      dry_run:
        description: "Dry run: bump, gate and package; upload and push nothing"
        type: boolean
        default: true

run-name: Publish CityGML crates (${{ inputs.bump }}${{ inputs.dry_run && ', dry run' || '' }})

# One publish at a time across every family: each pushes to main.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Choose the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Refuse a real publish off main
        if: ${{ !inputs.dry_run && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::a real publish runs from main; this run is on ${GITHUB_REF_NAME}. Dry runs may use any branch."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tags, to refuse one that exists
          submodules: false

      - name: Test the bump script
        run: python3 -m unittest discover -s .github/scripts

      - name: Bump the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: echo "version=$(python3 .github/scripts/bump-version.py citygml "$BUMP")" >> "$GITHUB_OUTPUT"

      # crates.io would refuse a taken version too, but only partway through a
      # multi-crate upload, which is a worse place to find out.
      - name: Check citygml-v${{ steps.version.outputs.version }} is free
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/citygml-v${VERSION}" > /dev/null; then
            echo "::error::tag citygml-v${VERSION} already exists"
            exit 1
          fi
          for crate in citygml-core citygml2 citygml3 citygml-rs citygml-citydb; do
            status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
                        -H 'User-Agent: cityjson/cityparquet publish workflow' \
                        "https://crates.io/api/v1/crates/${crate}/${VERSION}")"
            case "${status}" in
              404) echo "${crate} ${VERSION} is free" ;;
              200) echo "::error::${crate} ${VERSION} is already on crates.io"; exit 1 ;;
              *) echo "::error::crates.io answered ${status} for ${crate} ${VERSION}"; exit 1 ;;
            esac
          done
          echo "Version: **citygml-v${VERSION}** (${{ inputs.bump }})" >> "$GITHUB_STEP_SUMMARY"

  # The full Rust gate on the commit being released. The bump changes no code,
  # so the gate runs on the commit as it stands.
  gate:
    name: Rust gate
    needs: prepare
    uses: ./.github/workflows/rust.yml

  publish:
    name: ${{ inputs.dry_run && 'cargo publish --dry-run' || 'cargo publish' }}
    needs: [prepare, gate]
    runs-on: ubuntu-latest
    # The environment the CityParquet crates publish from, so the registry
    # token sits behind the same protection rule.
    environment: crates-io
    permissions:
      contents: write # push the release commit and tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the release commit is rebased onto main and merged into develop
          submodules: false

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            lib/citygml-rs/target
          key: publish-citygml-${{ runner.os }}-${{ hashFiles('lib/citygml-rs/Cargo.lock') }}
          restore-keys: publish-citygml-${{ runner.os }}-

      # Committed and tagged BEFORE the upload, so the packaged crates record
      # the release commit (.cargo_vcs_info.json) and the tree is clean. Neither
      # leaves the runner until the upload has succeeded.
      - name: Bump, commit and tag citygml-v${{ needs.prepare.outputs.version }}
        env:
          BUMP: ${{ inputs.bump }}
          EXPECTED: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          version="$(python3 .github/scripts/bump-version.py citygml "$BUMP")"
          test "${version}" = "${EXPECTED}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -am "release: citygml-v${version}"
          git tag -a "citygml-v${version}" -m "citygml-v${version}"

      # cargo orders a multi-package publish itself, waits for each crate to
      # reach the index before uploading its dependents, and verifies every
      # named crate before uploading any of them. A dry run verifies against
      # the not-yet-published siblings the same way.
      - name: Publish
        working-directory: lib/citygml-rs
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          crates=(-p citygml-core -p citygml2 -p citygml3 -p citygml-rs -p citygml-citydb)
          if [ "${DRY_RUN}" = "true" ]; then
            cargo publish --dry-run --locked "${crates[@]}"
          else
            if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
              echo "::error::CARGO_REGISTRY_TOKEN is not set"
              exit 1
            fi
            cargo publish --locked "${crates[@]}"
          fi

      - name: Push the release commit and tag
        if: ${{ !inputs.dry_run }}
        run: bash .github/scripts/push-release.sh "citygml-v${{ needs.prepare.outputs.version }}"

      # The files the Release workflow attaches: the five crates as uploaded.
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.dry_run }}
        with:
          name: release-asset-crates
          path: lib/citygml-rs/target/package/*.crate
          if-no-files-found: error

      # What the Release workflow reads. Uploaded only by a real publish, so a
      # dry run leaves it nothing to release.
      - name: Describe the release
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-meta
          echo "citygml-v${VERSION}" > release-meta/tag
          echo "CityGML crates v${VERSION}" > release-meta/title
          echo "false" > release-meta/latest
          cat > release-meta/notes.md <<EOF
          Published to crates.io:
          - [\`citygml-rs ${VERSION}\`](https://crates.io/crates/citygml-rs/${VERSION}): CityGML 2.0 and 3.0 to and from CityJSON; the library is \`citygml\` ([docs](https://docs.rs/citygml-rs/${VERSION}))
          - [\`citygml-core ${VERSION}\`](https://crates.io/crates/citygml-core/${VERSION}): the version-neutral model and the conversions
          - [\`citygml2 ${VERSION}\`](https://crates.io/crates/citygml2/${VERSION}): the CityGML 2.0 reader and writer
          - [\`citygml3 ${VERSION}\`](https://crates.io/crates/citygml3/${VERSION}): the CityGML 3.0 reader and writer
          - [\`citygml-citydb ${VERSION}\`](https://crates.io/crates/citygml-citydb/${VERSION}): the 3DCityDB v5 reader
          EOF

      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.dry_run }}
        with:
          name: release-meta
          path: release-meta/
          if-no-files-found: error

      - name: Summary
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "${DRY_RUN}" = "true" ]; then
            echo "Dry run: citygml-v${VERSION} was gated and packaged. Nothing was published or pushed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Published citygml-core, citygml2, citygml3, citygml-rs and citygml-citydb ${VERSION}; tagged citygml-v${VERSION}." >> "$GITHUB_STEP_SUMMARY"
          fi
