name: Release

# Creates the GitHub release for what a publish workflow just published, with
# the files that run built attached and a SHA256SUMS over them.
#
#   Publish crates  →  vX.Y.Z      the crates; the `cityparquet` CLI for five targets
#   Publish MCP     →  mcp-vX.Y.Z  the MCP server; its npm tarball
#
# Bare `vX.Y.Z` belongs to the Rust reference implementation, and its release
# is the repository's Latest. Every other published implementation gets its own
# prefix, `<name>-vX.Y.Z`, for its tags and its releases alike. A prefix rather
# than a `-suffix`: `v0.1.0-ts` is a semver pre-release, which GitHub and every
# version sorter would rank below `v0.1.0`.
#
# A publish run says what to release through its `release-meta` artifact (tag,
# title, notes, whether it is Latest) and hands over its files as
# `release-asset-*` artifacts. A dry run uploads no `release-meta`, so this
# skips it. Idempotent: a tag that already has a release is skipped.
#
# Runs after either publish workflow succeeds. To retry by hand, dispatch it
# with the publish run's id (the number at the end of the run's URL).

on:
  workflow_run:
    workflows: ["Publish crates", "Publish MCP"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "The Publish crates or Publish MCP run to release"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # create the release and upload its files
  actions: read # read the publish run's artifacts

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tags, for the notes' starting point
          submodules: false

      - name: What to release
        id: meta
        run: |
          set -euo pipefail
          run="$(gh api "repos/${GH_REPO}/actions/runs/${RUN_ID}" --jq '[.name, .conclusion] | @tsv')"
          name="${run%%$'\t'*}"
          conclusion="${run##*$'\t'}"
          case "${name}" in
            "Publish crates" | "Publish MCP") ;;
            *) echo "::error::run ${RUN_ID} is \"${name}\", not a publish run"; exit 1 ;;
          esac
          if [ "${conclusion}" != "success" ]; then
            echo "::error::run ${RUN_ID} (${name}) ended in ${conclusion}; there is nothing to release"
            exit 1
          fi
          artifacts="$(gh api "repos/${GH_REPO}/actions/runs/${RUN_ID}/artifacts" --paginate --jq '.artifacts[].name')"
          if ! grep -qx release-meta <<< "${artifacts}"; then
            echo "Run ${RUN_ID} (${name}) was a dry run: it published nothing, so there is no release to make." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh run download "${RUN_ID}" --name release-meta --dir "${RUNNER_TEMP}/meta"
          tag="$(cat "${RUNNER_TEMP}/meta/tag")"
          if gh release view "${tag}" > /dev/null 2>&1; then
            echo "${tag} already has a release; nothing to do." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --force --tags origin
          if ! git rev-parse -q --verify "refs/tags/${tag}" > /dev/null; then
            echo "::error::run ${RUN_ID} published ${tag}, but the tag is not in the repository"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Collect the files
        if: steps.meta.outputs.skip != 'true'
        run: |
          set -euo pipefail
          gh run download "${RUN_ID}" --pattern 'release-asset-*' --dir "${RUNNER_TEMP}/assets"
          mkdir -p dist
          find "${RUNNER_TEMP}/assets" -type f -exec mv {} dist/ \;
          if [ -z "$(ls dist)" ]; then
            echo "::error::run ${RUN_ID} uploaded no release-asset-* files"
            exit 1
          fi
          # One checksum file for the whole release, so a verifier needs one
          # download rather than one per file.
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)

      # The generated notes start from the previous release of the same
      # family, so an MCP release does not list the crates' commits as its own.
      - name: Create the release
        if: steps.meta.outputs.skip != 'true'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          META: ${{ runner.temp }}/meta
        run: |
          set -euo pipefail
          family="${TAG%v*}"
          previous="$(git tag --list "${family}v*" --sort=-v:refname \
                        | grep -E "^${family}v[0-9]+\.[0-9]+\.[0-9]+$" \
                        | grep -Fvx "${TAG}" | head -n 1 || true)"
          args=()
          if [ -n "${previous}" ]; then args+=(--notes-start-tag "${previous}"); fi
          gh release create "${TAG}" dist/* \
            --verify-tag \
            --title "$(cat "${META}/title")" \
            --notes-file "${META}/notes.md" \
            --generate-notes \
            --latest="$(cat "${META}/latest")" \
            "${args[@]}"
          echo "Released [${TAG}](https://github.com/${GH_REPO}/releases/tag/${TAG})." >> "$GITHUB_STEP_SUMMARY"
