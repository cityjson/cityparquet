name: Python

# The gate for the Python bindings (lib/cityparquet-py): build the extension
# and run its tests. Nothing is published here; publish-python.yml calls this
# gate before it uploads. The tests read the library's committed test data, so
# this needs no fixtures and no network.

on:
  push:
    branches: [main, develop]
    paths:
      - "lib/cityparquet-py/**"
      - "lib/cityparquet-rs/**"
      - "lib/citygml-rs/**"
      - "justfile"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "lib/cityparquet-py/**"
      - "lib/cityparquet-rs/**"
      - "lib/citygml-rs/**"
      - "justfile"
      - ".github/workflows/python.yml"
  workflow_dispatch:
  # publish-python.yml runs this gate before building the wheels it uploads.
  workflow_call:

# The workflow name is part of the group because a caller's run shares its ref:
# the gate inside "Publish Python" on main must not cancel, or be cancelled by,
# a push to main.
concurrency:
  group: python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: bindings tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: false

      # lib/cityparquet-py/rust-toolchain.toml pins the version; rustup
      # honours it on first use.
      - name: Cache cargo
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            lib/cityparquet-py/target
          key: python-${{ runner.os }}-${{ hashFiles('lib/cityparquet-py/Cargo.lock') }}
          restore-keys: python-${{ runner.os }}-

      - uses: extractions/setup-just@v4.0.0
      - uses: astral-sh/setup-uv@v10.3.3

      - name: just py-test
        run: just py-test
