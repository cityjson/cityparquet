[workspace]
resolver = "3"
members = ["crates/cityparquet-schema", "crates/cityparquet", "crates/cityparquet-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/HideBa/cityparquet-rs"

[workspace.dependencies]
arrow-schema = "58"
arrow-array = "58"
arrow-buffer = "58"
parquet = { version = "58", features = ["zstd"] }
geoarrow-schema = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
cjseq = "0.4"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
wkb = "0.9"
geo-traits = "0.3"
tempfile = "3"
cityparquet-schema = { path = "crates/cityparquet-schema" }
