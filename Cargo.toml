[workspace]
resolver = "3"
members = ["crates/cityparquet-schema", "crates/cityparquet", "crates/cityparquet-cli", "crates/cityparquet-readbench"]
# Vendored submodules are independent Cargo projects with their own lockfiles and
# toolchains; they must not be pulled into this workspace.
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/HideBa/cityparquet-rs"

[workspace.dependencies]
arrow-schema = "58"
arrow-array = "58"
arrow-buffer = "58"
arrow-select = "58"
parquet = { version = "58", features = ["zstd"] }
geoarrow-schema = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
cjseq = "0.4"
quick-xml = "0.37"
chrono = "0.4"
flate2 = "1"
clap = { version = "4", features = ["derive"] }
glob = "0.3"
wkb = "0.9"
geo-traits = "0.3"
geo = "0.30"
tempfile = "3"
fcb_core = "0.7"
peak_alloc = "0.3.0"
cityparquet-schema = { path = "crates/cityparquet-schema" }
city3d-stac-types = { git = "https://github.com/cityjson/city3d-stac-tool", rev = "743199c9b9ff566ec42c4023ce0968e9ac6af485" }
jsonschema = "0.26"
