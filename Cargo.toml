[workspace]
resolver = "3"
members = ["crates/cityparquet-schema", "crates/cityparquet", "crates/cityparquet-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/HideBa/cityparquet-rs"

[workspace.dependencies]
arrow-schema = "59"
geoarrow-schema = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
cityparquet-schema = { path = "crates/cityparquet-schema" }
