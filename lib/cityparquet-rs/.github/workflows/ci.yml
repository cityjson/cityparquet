name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # No submodules: the city3d-stac crates and cjseq come from crates.io.
      - uses: actions/checkout@v4
        with: { submodules: false }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # Markdown is formatted by Prettier (`just fmt`, and .githooks/pre-commit
      # on every commit); pinned exactly, in step with the justfile and the hook.
      - run: npx --yes prettier@3.9.6 --log-level warn --check "**/*.md"
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: extractions/setup-just@v2
      - run: just fixtures
      - run: cargo test --workspace
      - run: just isolation
