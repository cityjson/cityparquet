[workspace]
resolver = "3"
# Directories are short because the enclosing directory already says
# "cityparquet"; the PACKAGE names stay namespaced (`cityparquet`,
# `cityparquet-schema`, `cityparquet-cli`) because those are global on
# crates.io, where `core`, `schema` and `cli` are taken or reserved.
members = ["crates/schema", "crates/core", "crates/cli"]
# `cityparquet-readbench` is NOT a member: it is benchmark code, it lives with
# the rest of the benchmark under ../../benchmark/readbench, and it is its own
# workspace there (see the migration note's D6 — independent workspaces are the
# established pattern in this tree).
# Vendored submodules are independent Cargo projects with their own lockfiles and
# toolchains; they must not be pulled into this workspace.
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cityjson/cityparquet"

[workspace.dependencies]
arrow-schema = "58"
arrow-array = "58"
arrow-buffer = "58"
arrow-select = "58"
parquet = { version = "58", features = ["zstd"] }
geoarrow-schema = "0.8"
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` makes serde_json's float PARSER correctly rounded. Without
# it the default fast path can land 1 ULP off, so an attribute written as
# 28.184951782226562 was stored as the double below it — a conversion that
# does not preserve the source value it was handed.
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
cjseq = "0.4"
quick-xml = "0.37"
chrono = "0.4"
flate2 = "1"
object_store = { version = "0.13", features = ["http"] }
tokio = { version = "1.53.1", features = ["rt", "macros", "rt-multi-thread"] }
axum = "0.8.9"
tower-http = { version = "0.6", features = ["fs"] }
bytes = "1.12.1"
async-trait = "0.1.91"
clap = { version = "4", features = ["derive"] }
glob = "0.3"
wkb = "0.9"
geo-traits = "0.3"
geo = "0.30"
tempfile = "3"
fcb_core = "0.7"
peak_alloc = "0.3.0"
cityparquet-schema = { path = "crates/schema", version = "0.1.0" }
city3d-stac-types = { git = "https://github.com/cityjson/city3d-stac-tool", rev = "743199c9b9ff566ec42c4023ce0968e9ac6af485" }
jsonschema = "0.26"

# vendor/cjseq carries a patched 0.4.1: upstream's `add_cjfeature`/
# `update_texture` mis-base merged texture UV-vertex indices, corrupting
# `.city.json` (Doc-format) export. See vendor/cjseq/PATCHES.md.
[patch.crates-io]
cjseq = { path = "vendor/cjseq" }
