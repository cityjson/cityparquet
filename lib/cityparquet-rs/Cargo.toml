[workspace]
resolver = "3"
# Directories are short because the enclosing directory already says
# "cityparquet"; the PACKAGE names stay namespaced (`cityparquet`,
# `cityparquet-schema`, `cityparquet-cli`) because those are global on
# crates.io, where `core`, `schema` and `cli` are taken or reserved.
members = ["crates/schema", "crates/core", "crates/cli"]
# `cityparquet-readbench` is NOT a member: it is benchmark code, it lives with
# the rest of the benchmark under ../../benchmark/readbench, and it is its own
# workspace there (see the migration note's D6 — independent workspaces are the
# established pattern in this tree).

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cityjson/cityparquet"

[workspace.dependencies]
# `canonical_extension_types`: the `arrow.json` extension type, which the
# Parquet writer maps to the JSON logical type the spec gives `other` and
# `geometry_properties_lod*.surfaces`.
arrow-schema = { version = "58", features = ["canonical_extension_types"] }
arrow-array = "58"
arrow-buffer = "58"
arrow-select = "58"
arrow-cast = "58"
arrow-ipc = { version = "58", features = ["lz4"] }
parquet = { version = "58", features = [
    "zstd",
    "geospatial",
    "arrow_canonical_extension_types",
] }
parquet-geospatial = "58"
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` makes serde_json's float PARSER correctly rounded. Without
# it the default fast path can land 1 ULP off, so an attribute written as
# 28.184951782226562 was stored as the double below it — a conversion that
# does not preserve the source value it was handed.
# `raw_value` lets the EPSG table index each entry as unparsed text, so a CRS
# lookup parses only the entry it asked for (D-RS-15).
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
thiserror = "2"
# The exact pin makes each cjseq pre-release a deliberate step while its API
# is still moving. The `cli` feature (clap, rand) is not needed.
cjseq = { version = "=0.5.0-alpha.1", default-features = false }
quick-xml = "0.39"
# The CityGML readers and writers and the 3DCityDB reader, from this monorepo's
# `lib/citygml-rs` workspace. They
# pin the same cjseq as above, so both resolve to one copy.
citygml = { path = "../citygml-rs/crates/citygml", version = "0.1.0" }
citygml-citydb = { path = "../citygml-rs/crates/citydb", version = "0.1.0" }
chrono = "0.4"
flate2 = "1"
object_store = { version = "0.13", features = ["http"] }
tokio = { version = "1.53.1", features = ["rt", "macros", "rt-multi-thread"] }
axum = "0.8.9"
tower-http = { version = "0.6", features = ["fs"] }
bytes = "1.12.1"
async-trait = "0.1.91"
clap = { version = "4", features = ["derive"] }
glob = "0.3"
wkb = "0.9"
geo-traits = "0.3"
geo = "0.31"
tempfile = "3"
# The release workflow (.github/scripts/bump-version.py) bumps these two
# requirements together with `[workspace.package] version`.
cityparquet = { path = "crates/core", version = "0.1.0" }
cityparquet-schema = { path = "crates/schema", version = "0.1.0" }
city3d-stac-types = "0.1.1"
# The STAC generator — `StacCollectionBuilder` for `cityparquet collection`.
# Only the CLI depends on it, behind its `collection` feature: it pulls in the
# `stac`, `object_store`, `reqwest` and `fcb_core` stacks, which neither the
# library nor the schema crate may carry. Same release line as
# city3d-stac-types (gen 0.3.1 requires types ^0.1.1), so the two resolve to
# one copy of the types crate.
city3d-stac-gen = "0.3.1"
jsonschema = "0.26"
# HyperLogLog++ distinct counts for the bloom-filter high-cardinality rule
# (`scan`). Deterministic WyHash default: the selected columns, and so the
# package layout, are identical run to run.
cardinality-estimator = "1.0.3"
# Parses CityJSONSeq feature lines a batch at a time across cores.
rayon = "1.12"
# FlatCityBuf input (the `fcb` feature). The exact pin the read benchmark
# (`benchmark/readbench`) carries, so the two resolve to one version.
fcb_core = "=0.7.6"
