[package]
name = "cityparquet-cli"
description = "CityParquet command-line tool"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "cityparquet"
path = "src/main.rs"
doc = false

[dependencies]
cityparquet = { workspace = true }
cityparquet-schema = { workspace = true }
clap = { workspace = true, features = ["derive"] }
arrow-array = { workspace = true }
parquet = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
city3d-stac-gen = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }

[features]
default = ["collection", "fcb", "citydb"]
# FlatCityBuf (`.fcb`) input for `convert`.
fcb = ["cityparquet/fcb"]
# 3DCityDB v5 input for `convert` (`convert postgresql://…`).
citydb = ["cityparquet/citydb"]
# `cityparquet collection`: a STAC Collection over packages' Items, built by
# city3d-stac-gen (see the workspace manifest for why it is optional).
collection = ["dep:city3d-stac-gen", "dep:chrono"]

[dev-dependencies]
cjseq = { workspace = true }
