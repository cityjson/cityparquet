[workspace]
resolver = "3"
# Short directory names; the package names (`citygml-core`, `citygml2`,
# `citygml3`) are what crates.io sees.
members = ["crates/core", "crates/citygml2", "crates/citygml3"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cityjson/cityparquet"

[workspace.dependencies]
citygml-core = { path = "crates/core", version = "0.1.0", default-features = false }
# The exact pin `lib/cityparquet-rs` carries too. Every tool that links these
# crates must resolve the same cjseq, or it builds two incompatible copies of
# cjseq's types.
cjseq = { version = "=0.5.0-alpha.1", default-features = false }
memchr = "2.7"
quick-xml = "0.39"
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
