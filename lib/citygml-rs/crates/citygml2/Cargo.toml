[package]
name = "citygml2"
description = "CityGML 2.0 reader and writer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
# The tests read CityGML files of tens of megabytes; a published crate carries
# the library alone.
exclude = ["tests/"]

[dependencies]
citygml-core = { workspace = true }
quick-xml = { workspace = true }
cjseq = { workspace = true, optional = true }

[dev-dependencies]
cjseq = { workspace = true }
serde = "1"
serde_json = { workspace = true }

[features]
default = ["cjseq"]
# `FeatureReader::features`, which yields cjseq `CityJSONFeature`s.
cjseq = ["dep:cjseq", "citygml-core/cjseq"]
