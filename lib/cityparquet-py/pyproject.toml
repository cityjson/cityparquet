[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "cityparquet"
description = "Python bindings for CityParquet: convert, export and validate packages"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
dynamic = ["version"]
keywords = ["cityjson", "citygml", "parquet", "3d-city-models", "gis"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.urls]
Homepage = "https://cityjson.github.io/cityparquet/"
Specification = "https://cityjson.github.io/cityparquet/specification"
Repository = "https://github.com/cityjson/cityparquet"
Issues = "https://github.com/cityjson/cityparquet/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.maturin]
module-name = "cityparquet"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "RUF",
    "SIM",
    "UP",
]
