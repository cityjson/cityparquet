[package]
name = "citylake"
version = "0.1.0"
edition = "2021"
description = "A data lake framework and web API for 3D city models (CityJSON) using DuckDB"

[lib]
name = "citylake"
path = "src/lib.rs"

[dependencies]
# Database
# Pinned to DuckDB v1.5.4: duckdb-rs versions as 1.105XX.0 for DuckDB 1.5.XX,
# and the cityjson extension's distribution pipeline builds for exactly that
# version. A mismatch does not degrade — it fails `LOAD cityjson`. Bump in
# lockstep with the extension's release matrix.
duckdb = { version = "=1.10504.0", features = ["bundled", "json"] }

# Web framework (only needed for binary/server)
axum = { version = "0.8", features = ["multipart"], optional = true }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["cors", "trace"], optional = true }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async
async-trait = "0.1"

# Error handling
thiserror = "2"
anyhow = "1"

# File operations
tempfile = "3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
http = "1"

[features]
default = ["server"]
server = ["axum", "tower", "tower-http", "tracing-subscriber"]
