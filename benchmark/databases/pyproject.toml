[project]
name = "citybench"
version = "0.1.0"
description = "Cross-system benchmark: CityParquet vs cjdb vs 3DCityDB v5"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "duckdb>=1.3.2",
    "pytz>=2026.3.post1",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/citybench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs Docker containers running (deselect with '-m \"not integration\"')",
]
