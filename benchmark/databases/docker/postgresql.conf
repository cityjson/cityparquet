# Shared tuning, applied identically to both benchmark databases.
# Stock PostgreSQL defaults (128MB shared_buffers) would make either
# database a strawman on this hardware. These values are recorded in the
# run manifest and must be cited alongside any published number.
listen_addresses = '*'
max_connections = 20

shared_buffers = 8GB
effective_cache_size = 24GB
work_mem = 256MB
maintenance_work_mem = 2GB

# SSD-appropriate: sequential and random reads cost about the same.
random_page_cost = 1.1
effective_io_concurrency = 200

# max_parallel_workers_per_gather bounds how many CPUs a SINGLE query can
# use (leader + this many workers); max_parallel_workers is the
# cluster-wide pool it draws from. Both containers have a measured 16-core
# cgroup quota (see README "Resource limits"), so per-query parallelism is
# capped at 16, not the previous 4 (leader+4=5) -- see I4, final
# whole-branch review: DuckDB is given 16 threads per query
# (duckdb_cp.py), so capping PostgreSQL at leader+4 gave it at most 5 of
# its allotted 16 cores per query, an unfair asymmetry against it. Raising
# this is the fair direction: it lets PostgreSQL use the budget it is
# already allotted, rather than throttling DuckDB down to match.
max_worker_processes = 16
max_parallel_workers = 16
max_parallel_workers_per_gather = 16

# Timing instrumentation must be available for EXPLAIN (ANALYZE, BUFFERS).
track_io_timing = on
