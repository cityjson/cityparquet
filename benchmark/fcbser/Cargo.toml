# `fcb-ser-stream` — `fcb ser -A` for an input too large to hold in memory.
#
# Its own Cargo workspace, and it has to be: the artefact must be written by
# the SAME `fcb_core` the pinned `fcb` CLI writes with (0.7.8,
# benchmark/scripts/fetch_tools.sh), while benchmark/readbench reads with
# `fcb_core` 0.7.6. Cargo cannot hold both in one graph — they are one semver
# range — so the writer cannot be a `[[bin]]` of the read harness.
[workspace]
resolver = "3"
members = ["."]

[package]
name = "cityparquet-fcbser"
description = "Streaming FlatCityBuf serialiser for the national benchmark dataset"
publish = false
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cityjson/cityparquet"

[[bin]]
name = "fcb-ser-stream"
path = "src/main.rs"

[dependencies]
# EXACT pins: the writer the pinned `fcb` CLI is built from, and the `cjseq2`
# that writer's public types come from. `src/main.rs` also relies on a private
# invariant of this exact `fcb_core` (see `add_streamed`), so a range would be
# unsound as well as unreproducible.
fcb_core = { version = "=0.7.8", default-features = false }
cjseq2 = "=0.2.0-alpha.1"
serde_json = "1"
anyhow = "1"
