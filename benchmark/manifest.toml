# Shared identity and selection manifest for the benchmark suite.  Result CSVs
# remain the raw evidence; this file only gives stable IDs and paper labels to
# the inputs that produced them.

[suite]
version = 2
families = ["sizes", "formats", "bloom", "databases", "network"]
# The 3DBAG slice: the largest input of the format and size comparisons, and
# the dataset the database family measures.
slice_dataset = "3dbag_n1000000"
# The national dataset: the whole of 3DBAG. No profile selects it; `--national`
# adds it and `--datasets 3dbag-national` names it.
national_dataset = "3dbag_national"
# The dataset that stands in for the slice in the database family under the
# `short` and `smoke` profiles, and the one dataset the `smoke` profile
# measures: the corpus's smallest. It declares no CRS, so 3DCityDB is
# initialised with the EPSG:7415 placeholder (databases/README.md).
small_database_dataset = "vienna"

# The network family's simulated profiles: a bandwidth shared by every
# connection and a latency paid by every request. `typical` is the default.
# The formats family's whole-file formats (citygml, cityjson, cityjsonseq)
# have no index: their reader parses the whole file whatever the query. They
# are measured only on these scenarios; on every other scenario a cell takes
# one check sample (its answer stays in the cross-format check) and reuses the
# time and memory of read all. `full-read,id-lookup`, `full-read` or `all`;
# `--formats-whole-file-scenarios` overrides it.
[formats]
whole_file_scenarios = "full-read,id-lookup"

# The network family's whole-file formats (citygml, cityjson, cityjsonseq)
# answer every query with one whole-object GET, so they are measured only on
# these scenarios and every other scenario is a derived row (read all's bytes
# and requests, no time). `full-read,id-lookup`, `full-read` or `all`;
# `--network-whole-file-scenarios` overrides it.
[network]
whole_file_scenarios = "full-read,id-lookup"

[network_profiles.fast]
bandwidth_mbps = 1000.0
latency_ms = 5.0

[network_profiles.typical]
bandwidth_mbps = 100.0
latency_ms = 20.0

[network_profiles.slow]
bandwidth_mbps = 20.0
latency_ms = 50.0

[datasets.vienna]
source = "vienna_102081.city.json"
title = "Vienna"
role = "corpus"

[datasets.new_york]
source = "nyc_da13_buildings.city.json"
title = "New York"
role = "corpus"

[datasets.zurich]
source = "zurich_building_lod2.city.json"
title = "Zurich"
role = "corpus"

[datasets.tokyo]
source = "tokyo.city.json"
title = "Tokyo (Chiyoda)"
role = "corpus"

[datasets.montreal]
source = "montreal.city.json"
title = "Montréal"
role = "corpus"

[datasets.helsinki]
source = "helsinki.city.json"
title = "Helsinki"
role = "corpus"

# The one 3DBAG input: the first 1,000,000 CityObjects of one published
# FlatCityBuf source, in source order and in whole features (so slightly more
# than the nominal count), cut without LoD 1.2 by the `fcb-slice` binary that
# `just fetch-3dbag` drives.
[datasets.3dbag_n1000000]
source = "3dbag_n1000000.city.jsonl"
# The bloom axis's attribute probes (`attr-lookup`): text attributes that
# carry a Bloom filter in the `cityparquet` package (`just bloom-columns`
# lists them). On the slice only `identificatie` qualifies (distinct ratio
# 1.0, one value per Building); no repeating text attribute reaches the
# writer's 0.2 threshold — `documentnummer`, the most varied, is 0.114.
bloom_attributes = ["identificatie"]
# Configuration-axis packages preparation builds beside the main package
# (by the code path a `--variants` run uses) and the hosted corpus carries:
# the bloom axis's package without Bloom filters.
variant_artefacts = ["cityparquet-nobloom"]
title = "3DBAG (Netherlands)"
# The feature-boundary cutter records the observed total in each result
# sidecar; this nominal identifier remains stable for paths and commands.
target_objects = 1000000
role = "slice"

# The whole of 3DBAG v20250903: every one of its 8,941 tiles merged into one
# CityJSONSeq by `just fetch-3dbag-national` (10,771,547 features, about
# 66 GB). `formats` names the formats it is produced in: citygml-tools cannot
# write a CityGML document of this size and a single CityJSON document cannot
# be held in memory, so those two formats are not applicable, and no factor
# against CityGML exists for this dataset. It keeps every LoD 3DBAG publishes
# (0, 1.2, 1.3 and 2.2); the slice above drops LoD 1.2 for CityGML's sake.
# The sizes and formats families measure it; the bloom, network and database
# families do not. It is always built on the measuring host and never hosted
# (benchmark/README.md, "The national dataset").
[datasets.3dbag_national]
source = "3dbag_national.city.jsonl"
title = "3DBAG (Netherlands, national)"
role = "national"
formats = ["cityjsonseq", "flatcitybuf", "cityparquet"]
