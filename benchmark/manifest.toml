# Shared identity and selection manifest for the benchmark suite.  Result CSVs
# remain the raw evidence; this file only gives stable IDs and paper labels to
# the inputs that produced them.

[suite]
version = 2
families = ["sizes", "formats", "bloom", "databases"]
# The 3DBAG slice: the largest input of the format and size comparisons, and
# the dataset the database family measures.
slice_dataset = "3dbag_n1000000"
# The dataset that stands in for the slice in the database family under the
# `short` and `smoke` profiles: small, and in the slice's CRS (EPSG:7415).
small_database_dataset = "rotterdam"

[datasets.rotterdam]
source = "rotterdam_delfshaven.city.json"
title = "Rotterdam"
role = "corpus"

[datasets.ingolstadt]
source = "ingolstadt.city.json"
title = "Ingolstadt"
role = "corpus"

[datasets.vienna]
source = "vienna_102081.city.json"
title = "Vienna"
role = "corpus"

[datasets.new_york]
source = "nyc_da13_buildings.city.json"
title = "New York"
role = "corpus"

[datasets.zurich]
source = "zurich_building_lod2.city.json"
title = "Zurich"
role = "corpus"

[datasets.tokyo]
source = "tokyo.city.json"
title = "Tokyo (Chiyoda)"
role = "corpus"

[datasets.montreal]
source = "montreal.city.json"
title = "Montréal"
role = "corpus"

# The one 3DBAG input: the first 1,000,000 CityObjects of one published
# FlatCityBuf source, in source order and in whole features (so slightly more
# than the nominal count), cut without LoD 1.2 by the `fcb-slice` binary that
# `just fetch-3dbag` drives.
[datasets.3dbag_n1000000]
source = "3dbag_n1000000.city.jsonl"
title = "3DBAG (Netherlands)"
# The feature-boundary cutter records the observed total in each result
# sidecar; this nominal identifier remains stable for paths and commands.
target_objects = 1000000
role = "slice"
