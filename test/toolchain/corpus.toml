# The tool-chain test corpus.
#
# Every entry is a file as it was published, pinned by size and sha256: a
# mismatch is an error, never a reason to fetch again, because a dataset that
# changed under the test changes what the report means. `run.py fetch`
# downloads the entries of a profile into the work directory's `corpus/`.
#
# profile    quick (every run), full (adds the large city datasets), xl (adds
#            the whole Helsinki CityJSONSeq)
# kind       real (published data), derived (published data cut or converted
#            by a stated, reproducible step), fixture (a small file written to
#            exercise one feature; real data carries none of it)
# derive     head:N (the header line and first N-1 features of a CityJSONSeq,
#            fetched as a byte range), or fix:NAME (a fixture that is not
#            valid CityJSON, repaired by run.py's FIXES[NAME]); both pin the
#            original as source_bytes/source_sha256
# exercises  what the entry is in the corpus for; the report prints it
# rs_convert_args  extra `cityparquet convert` flags the source needs, each
#            with a comment saying why
# status     active, or pending with a `reason` (listed in the report, never run)
#
# Formats: cityjson, cityjsonseq, citygml2, citygml3, fcb.

